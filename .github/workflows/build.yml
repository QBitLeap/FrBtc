name: Build Fractal Umbrel images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test dashboard
        working-directory: fractal-node/dashboard
        run: python3 -m unittest -v test_server.py
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Fractald
        uses: docker/build-push-action@v7
        with:
          context: fractal-node/fractald
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qbitleap/frbtc-fractald:0.3.0
            ghcr.io/qbitleap/frbtc-fractald:latest
          cache-from: type=gha,scope=fractald
          cache-to: type=gha,mode=max,scope=fractald
      - name: Build and publish dashboard
        uses: docker/build-push-action@v7
        with:
          context: fractal-node/dashboard
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qbitleap/frbtc-dashboard:0.1.0
            ghcr.io/qbitleap/frbtc-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
