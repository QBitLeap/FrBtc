name: Build Fractal Umbrel images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load release coordinates
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' qbitleap-frbtc-fractal-node/umbrel-app.yml)"
          fractald_version="$(tr -d '[:space:]' < FRACTALD_VERSION)"
          fractald_sha256="$(tr -d '[:space:]' < FRACTALD_SHA256)"
          test -n "${app_version}"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "${fractald_version}"
          grep -Eq '^[0-9a-f]{64}$' <<< "${fractald_sha256}"
          printf 'APP_VERSION=%s\n' "${app_version}" >> "${GITHUB_ENV}"
          printf 'FRACTALD_VERSION=%s\n' "${fractald_version}" >> "${GITHUB_ENV}"
          printf 'FRACTALD_SHA256=%s\n' "${fractald_sha256}" >> "${GITHUB_ENV}"
      - name: Test dashboard
        working-directory: qbitleap-frbtc-fractal-node/dashboard
        run: python3 -m unittest -v test_server.py
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Fractald
        uses: docker/build-push-action@v7
        with:
          context: qbitleap-frbtc-fractal-node/fractald
          platforms: linux/amd64
          push: true
          build-args: |
            FRACTALD_VERSION=${{ env.FRACTALD_VERSION }}
            FRACTALD_SHA256=${{ env.FRACTALD_SHA256 }}
          tags: |
            ghcr.io/qbitleap/frbtc-fractald:${{ env.APP_VERSION }}
            ghcr.io/qbitleap/frbtc-fractald:latest
          cache-from: type=gha,scope=fractald
          cache-to: type=gha,mode=max,scope=fractald
      - name: Build and publish dashboard
        uses: docker/build-push-action@v7
        with:
          context: qbitleap-frbtc-fractal-node/dashboard
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qbitleap/frbtc-dashboard:${{ env.APP_VERSION }}
            ghcr.io/qbitleap/frbtc-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
