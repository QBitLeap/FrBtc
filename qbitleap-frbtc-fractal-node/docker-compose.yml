version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: qbitleap-frbtc-fractal-node_dashboard_1
      APP_PORT: 8090
      PROXY_AUTH_ADD: "false"

  config:
    image: alpine:3.21
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/app-data
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /app-data/config /app-data/fractal /app-data/dashboard
        cat > /app-data/config/bitcoin.conf <<'EOF_CONFIG'
        # QbitLeap managed Fractal Bitcoin configuration
        server=1
        listen=1
        prune=2000
        txindex=0
        dbcache=1024
        maxmempool=150
        maxconnections=125
        dnsseed=1
        addnode=34.87.61.167:8333
        addnode=34.92.14.221:8333
        addnode=35.235.106.223:8333
        addnode=35.189.95.174:8333
        rpcbind=0.0.0.0
        rpcallowip=127.0.0.1
        rpcallowip=10.0.0.0/8
        rpcallowip=172.16.0.0/12
        rpcallowip=192.168.0.0/16
        rpcuser=${APP_FRACTAL_RPC_USER}
        rpcpassword=${APP_FRACTAL_RPC_PASS}
        rpcport=8332
        port=8333
        printtoconsole=1
        EOF_CONFIG
        chmod 600 /app-data/config/bitcoin.conf
        chown -R 1000:1000 /app-data/config /app-data/fractal /app-data/dashboard

  fractald:
    image: ghcr.io/qbitleap/frbtc-fractald:0.3.0
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      config:
        condition: service_completed_successfully
    command:
      - -datadir=/data
      - -conf=/config/bitcoin.conf
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/fractal:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bitcoin-cli -datadir=/data -conf=/config/bitcoin.conf
          -rpcconnect=127.0.0.1 getblockchaininfo >/dev/null
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  dashboard:
    image: ghcr.io/qbitleap/frbtc-dashboard:0.2.1
    restart: unless-stopped
    environment:
      DASHBOARD_PORT: "8090"
      FRACTAL_RPC_HOST: fractald
      FRACTAL_RPC_PORT: "8332"
      FRACTAL_RPC_USER: ${APP_FRACTAL_RPC_USER}
      FRACTAL_RPC_PASSWORD: ${APP_FRACTAL_RPC_PASS}
      FRACTAL_DATA_DIR: /fractal
      FRACTAL_RPC_TIMEOUT: "10"
      STATUS_CACHE_FILE: /state/last-status.json
    volumes:
      - ${APP_DATA_DIR}/data/fractal:/fractal:ro
      - ${APP_DATA_DIR}/data/dashboard:/state
    depends_on:
      fractald:
        condition: service_healthy
